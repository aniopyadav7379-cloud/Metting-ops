[tool.poetry]
name = "unicorn-commander-npu"
version = "1.0.0"
description = "Unicorn Commander Meeting Ops with NPU acceleration and MLIR-AIE2 kernel support"
authors = ["Unicorn Commander Team"]
packages = [{include = ".", from = "."}]

[tool.poetry.dependencies]
python = "^3.13"

# Core Web Framework
fastapi = "^0.115.14"
uvicorn = "^0.35.0"
pydantic = "^2.11.7"

# Database & ORM
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
email-validator = "^2.2.0"

# NPU & AI/ML Core (Python 3.13 optimized)
torch = "^2.7.1"
onnx = "^1.18.0"
onnxruntime = "^1.22.0"
numpy = "^2.3.1"

# NPU Development Tools
# mlir-python = "^18.0.0"  # Uncomment when available
# aie-python = "*"         # AMD AIE Python bindings (when available)

# Audio Processing (Essential for NPU)
pyaudio = "^0.2.14"
soundfile = "^0.12.0"
webrtcvad = "^2.0.10"

# Transcription & NLP (Core)
transformers = "^4.53.0"
# Note: Some audio/ML libs may need compatible LLVM - add manually if needed
# librosa = "^0.10.0"  # Requires LLVM - test separately
# sentence-transformers = "^5.0.0"  # Will add after LLVM compatibility check
# torch-audiomentations = "^0.12.0"  # May have LLVM deps

# File & Storage
aiofiles = "^24.1.0"
python-magic = "^0.4.27"

# Monitoring & Performance
psutil = "^5.9.8"
prometheus-client = "^0.21.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.0.0"}

# Development Tools
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
black = "^24.0.0"
ruff = "^0.7.0"

[tool.poetry.group.npu.dependencies]
# NPU-specific development dependencies
# These will be added as NPU toolchain becomes available
# xilinx-xrt-python = "*"
# mlir-aie2 = "*"
# amd-npu-tools = "*"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.0"
ipython = "^8.29.0"
matplotlib = "^3.9.0"
tensorboard = "^2.18.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
target-version = "py313"
line-length = 88
lint.select = ["E", "F", "W", "C", "N", "UP", "S", "B", "A", "C4", "ICN", "PIE", "T20", "Q"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

# NPU-specific configuration
[tool.unicorn-commander.npu]
# AMD NPU Phoenix configuration
npu_device = "phoenix"
xrt_path = "/opt/xilinx/xrt"
mlir_aie_path = "/opt/mlir-aie"  # When available
kernel_cache_dir = "./npu_kernels"
enable_custom_kernels = true
kernel_optimization_level = "O3"

# Performance tuning for Python 3.13
[tool.unicorn-commander.performance]
jit_compilation = true
free_threading = false  # Enable when NPU libraries support it
memory_pool_size = "1GB"
buffer_size = 16384
