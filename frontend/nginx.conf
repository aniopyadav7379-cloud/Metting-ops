server {
    listen 7777;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSO cookie headroom: oauth2-proxy issues a per-request CSRF cookie
    # (COOKIE_CSRF_PER_REQUEST) on top of the suite-wide .magicunicorn.dev
    # cookies, so a real browser session routinely exceeds nginx's default
    # 8k header line and every request died with "400 Request Header Or
    # Cookie Too Large" -- the whole app read as down while curl (which
    # sends no cookies) returned a healthy 200. Keep this well above the
    # worst case.
    large_client_header_buffers 8 32k;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Cross-origin isolation → SharedArrayBuffer, so onnxruntime-web runs multi-threaded
    # WASM for on-device STT/summary (the browser-first compute moat). credentialless lets
    # the CORS-loaded CDN resources (onnxruntime, HF model) load without needing CORP;
    # browsers without COEP support (older Safari) gracefully fall back to single-thread.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    # Enforced CSP (was Report-Only through the hardening rollout). default-src
    # 'self' is fail-closed; connect-src is locked to the API origin ('self',
    # which also covers same-origin wss:// live-transcription) plus only the
    # on-device-AI CDNs + model hosts — no more wildcard https:/http:/ws: that
    # let an XSS exfiltrate anywhere. 'wasm-unsafe-eval' (NOT 'unsafe-eval')
    # lets onnxruntime-web instantiate its WASM; blob: covers ORT's workers;
    # media-src blob: is recorded-audio playback; *.hf.co / *.huggingface.co
    # cover the Parakeet/transformers.js model download + its LFS/xet redirect.
    # script-src still carries 'unsafe-inline' for the two STATIC inline guards
    # in index.html (route rewrite + error logger) — follow-up hardening is to
    # hash or externalize those two and drop 'unsafe-inline'.
    # Cloudflare Web Analytics (privacy-respecting, cookieless RUM) is allowed:
    # static.cloudflareinsights.com serves beacon.min.js (script-src) and the
    # beacon POSTs to cloudflareinsights.com/cdn-cgi/rum (connect-src).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://us.i.posthog.com https://us-assets.i.posthog.com https://static.cloudflareinsights.com https://analytics.unicorncommander.ai; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: https://huggingface.co https://*.hf.co https://*.huggingface.co https://cdn.jsdelivr.net https://us.i.posthog.com https://us-assets.i.posthog.com https://cloudflareinsights.com https://analytics.unicorncommander.ai; worker-src 'self' blob:; media-src 'self' blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA service worker + manifest: always revalidate so updates ship.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Public invitation bootstrap. The secret arrives only in the URL fragment,
    # is moved to same-tab sessionStorage, and is never present in access logs.
    location = /invite-bootstrap.html {
        # `add_header` at location scope does not inherit the server-level
        # headers, so keep this small public document explicitly protected.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /invite-bootstrap.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # API proxy
    location /api {
        proxy_pass http://backend:9050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:9050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
