version: '3.8'

services:
  backend:
    build: ./backend
    container_name: unicorn-backend-dev
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./whisper_cache:/app/whisper_onnx_cache
      - /dev/snd:/dev/snd
    environment:
      - DATABASE_URL=sqlite:////app/data/meeting_sessions.db
      - PYTHONUNBUFFERED=1
      - RELOAD=true
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    group_add:
      - audio
    ports:
      - "9050:9050"
    networks:
      - unicorn-network
    command: python -m uvicorn main:app --host 0.0.0.0 --port 9050 --reload
    restart: unless-stopped

  frontend-dev:
    image: node:20-alpine
    container_name: unicorn-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:9050
    ports:
      - "5173:5173"
    networks:
      - unicorn-network
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

networks:
  unicorn-network:
    driver: bridge